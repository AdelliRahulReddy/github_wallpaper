name: github_wallpaper
description: "GitWall - Display your GitHub contributions as an auto-updating wallpaper"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ══════════════════════════════════════════════════════════════════════════
  # NETWORKING & API
  # ══════════════════════════════════════════════════════════════════════════
  http: ^1.2.2

  # ══════════════════════════════════════════════════════════════════════════
  # DATA PERSISTENCE
  # ══════════════════════════════════════════════════════════════════════════
  shared_preferences: ^2.3.3           # User preferences & settings
  flutter_secure_storage: ^9.2.2       # 🔐 Encrypted token storage

  # ══════════════════════════════════════════════════════════════════════════
  # FILE SYSTEM & STORAGE
  # ══════════════════════════════════════════════════════════════════════════
  path_provider: ^2.1.5                # Local file paths

  # ══════════════════════════════════════════════════════════════════════════
  # WALLPAPER ENGINE
  # ══════════════════════════════════════════════════════════════════════════
  wallpaper_manager_plus: ^2.0.3       # Set wallpaper (lock/home/both)

  # ══════════════════════════════════════════════════════════════════════════
  # UTILITIES
  # ══════════════════════════════════════════════════════════════════════════
  intl: ^0.19.0                        # Date & number formatting
  url_launcher: ^6.3.1                 # Open external links
  package_info_plus: ^8.1.2            # App version info
  synchronized: ^3.1.0+1               # ✨ NEW - Thread-safe lock operations
  crypto: ^3.0.6                      # Stable hashing (e.g., SHA-256)
  workmanager: ^0.9.0                 # 🔔 Background task scheduling (upgraded for Flutter compatibility)
  flutter_local_notifications: ^17.1.2 # Local notifications for background alerts
  share_plus: ^10.1.4                 # Share exported images
  home_widget: ^0.7.0                 # Home screen widgets (Android/iOS)
  provider: ^6.1.2                    # State management (ChangeNotifier)
  flutter_appauth: ^12.0.0            # GitHub OAuth (PKCE)
  timezone: ^0.9.4                    # Local notification scheduling timezone support
  flutter_timezone: ^4.1.0            # Device timezone for exact reminder scheduling

  # ══════════════════════════════════════════════════════════════════════════
  # UI/UX ENHANCEMENTS
  # ══════════════════════════════════════════════════════════════════════════
  smooth_page_indicator: ^1.2.0+3      # Page dots for onboarding
  fl_chart: ^0.68.0

  # ══════════════════════════════════════════════════════════════════════════
  # MATERIAL DESIGN & FIREBASE
  # ══════════════════════════════════════════════════════════════════════════
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  firebase_crashlytics: ^5.0.8
  firebase_messaging: ^16.1.2
  device_info_plus: ^10.1.0
  sensors_plus: ^5.0.1
  flutter_native_splash: ^2.4.2        # Native splash screen

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# ══════════════════════════════════════════════════════════════════════════
# APP ICON CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D1117"  # GitHub dark bg
  adaptive_icon_foreground: "assets/logo.png"

# ══════════════════════════════════════════════════════════════════════════
# NATIVE SPLASH SCREEN
# ══════════════════════════════════════════════════════════════════════════
flutter_native_splash:
  android: true
  ios: true
  color: "#0D1117"                     # GitHub dark bg
  image: assets/logo.png
  android_12:
    color: "#0D1117"
    image: assets/logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

flutter:
  uses-material-design: true

  # ══════════════════════════════════════════════════════════════════════════
  # ASSETS
  # ══════════════════════════════════════════════════════════════════════════
  assets:
    - assets/
