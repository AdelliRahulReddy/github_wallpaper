name: Secret Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          set -euo pipefail
          patterns='storePassword=|keyPassword=|-----BEGIN (RSA )?PRIVATE KEY-----|\"private_key\"\\s*:|\"type\"\\s*:\\s*\"service_account\"'
          excluded_regex='^(android/key\\.properties\\.example)$'
          failures=0
          while IFS= read -r f; do
            if [[ "$f" =~ $excluded_regex ]]; then
              continue
            fi
            if grep -nE "$patterns" "$f" >/dev/null 2>&1; then
              echo "Potential secret pattern found in: $f"
              grep -nE "$patterns" "$f" || true
              failures=1
            fi
          done < <(git ls-files)
          if [[ "$failures" -ne 0 ]]; then
            echo "Secret scan failed."
            exit 1
          fi
          echo "Secret scan passed."
